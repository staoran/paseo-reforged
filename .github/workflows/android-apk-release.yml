name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  publish-android-apk:
    if: ${{ vars.EAS_PROJECT_ID != '' }}
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Verify immutable tag checkout
        shell: bash
        run: |
          set -euo pipefail

          expected_commit="$(git rev-list -n 1 "$SOURCE_TAG")"
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$expected_commit" ]]; then
            echo "::error::Expected $SOURCE_TAG at $expected_commit, checked out $actual_commit."
            exit 1
          fi

          if [[ "$RELEASE_TAG" == "v0.2.0-beta.5" && "$actual_commit" != "4231b974c59f17f5edbd084751979faf5c54b7e8" ]]; then
            echo "::error::beta.5 APK recovery must build 4231b974c59f17f5edbd084751979faf5c54b7e8, checked out $actual_commit."
            exit 1
          fi

          echo "Verified immutable source: $SOURCE_TAG -> $actual_commit"

      - name: Enforce beta-only release gate
        if: env.IS_PRERELEASE != 'true'
        shell: bash
        run: |
          echo "::error::Stable Paseo Reforged releases are blocked until signing and store gates are approved."
          exit 1

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo Reforged $RELEASE_TAG"
            --notes ""
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Provision Android build swap
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_BUILD_SWAP_FILE="$RUNNER_TEMP/paseo-android-build.swap"
          echo "ANDROID_BUILD_SWAP_FILE=$ANDROID_BUILD_SWAP_FILE" >> "$GITHUB_ENV"

          if [[ "$ANDROID_BUILD_SWAP_FILE" != "$RUNNER_TEMP/"* ]]; then
            echo "::error::Swap file must stay inside RUNNER_TEMP."
            exit 1
          fi

          swap_size_mb=2048
          sudo fallocate -l "${swap_size_mb}M" "$ANDROID_BUILD_SWAP_FILE"
          sudo chmod 600 "$ANDROID_BUILD_SWAP_FILE"
          sudo mkswap "$ANDROID_BUILD_SWAP_FILE"
          sudo swapon "$ANDROID_BUILD_SWAP_FILE"

          if ! sudo swapon --show=NAME --noheadings | awk '{$1=$1; print}' | grep -Fxq "$ANDROID_BUILD_SWAP_FILE"; then
            echo "::error::Failed to activate Android build swap."
            exit 1
          fi

          free -h

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            android-gradle-v1-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('package-lock.json') }}-

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android APK on GitHub runner
        id: build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # Keep the local build below the memory envelope of a free hosted runner
          GRADLE_OPTS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=768m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dkotlin.daemon.jvm.options=-Xmx1024m"
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set -euo pipefail

          asset_name="Paseo-Reforged-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"

          cd packages/app

          android_perf_prefix="[ANDROID-PERF]"
          monitor_interval_seconds=15

          find_memory_cgroup() {
            local relative_path

            relative_path="$(awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup 2>/dev/null || true)"
            if [[ -n "$relative_path" && -d "/sys/fs/cgroup${relative_path}" ]]; then
              printf '%s' "/sys/fs/cgroup${relative_path}"
            elif [[ -d /sys/fs/cgroup ]]; then
              printf '%s' /sys/fs/cgroup
            fi
          }

          read_bytes_as_mib() {
            local path="$1"
            local value

            if [[ ! -r "$path" ]]; then
              printf '%s' unavailable
              return
            fi

            value="$(<"$path")"
            if [[ "$value" =~ ^[0-9]+$ ]]; then
              printf '%d' "$((value / 1024 / 1024))"
            else
              printf '%s' unavailable
            fi
          }

          read_memory_events() {
            local path="$1"

            if [[ ! -r "$path" ]]; then
              printf '%s' unavailable
              return
            fi

            awk '{ pairs = pairs (pairs ? "," : "") $1 "=" $2 } END { print pairs }' "$path"
          }

          monitor_build_resources() {
            local build_started_epoch="$1"
            local cgroup_dir
            local cgroup_peak_start_mib
            local monitor_sleep_pid=""
            local observed_peak_rss_kib=0
            local observed_peak_pid=unavailable
            local observed_peak_comm=unavailable
            local sample_count=0

            cgroup_dir="$(find_memory_cgroup)"
            cgroup_peak_start_mib="$(read_bytes_as_mib "${cgroup_dir:-/unavailable}/memory.peak")"

            emit_resource_summary() {
              local cgroup_peak_final_mib
              local cgroup_events_final

              cgroup_peak_final_mib="$(read_bytes_as_mib "${cgroup_dir:-/unavailable}/memory.peak")"
              cgroup_events_final="$(read_memory_events "${cgroup_dir:-/unavailable}/memory.events")"
              echo "$android_perf_prefix summary samples=$sample_count process_peak_rss_kib=$observed_peak_rss_kib process_peak_pid=$observed_peak_pid process_peak_comm=$observed_peak_comm cgroup_memory_peak_start_mib=$cgroup_peak_start_mib cgroup_memory_peak_final_mib=$cgroup_peak_final_mib cgroup_memory_events_final=$cgroup_events_final"
            }

            trap 'if [[ -n "${monitor_sleep_pid:-}" ]]; then kill "$monitor_sleep_pid" 2>/dev/null || true; wait "$monitor_sleep_pid" 2>/dev/null || true; fi; emit_resource_summary; exit 0' TERM INT

            while true; do
              local now_epoch
              local memory_available_mib
              local swap_free_mib
              local runner_temp_available_mib
              local cgroup_current_mib
              local cgroup_peak_mib
              local cgroup_swap_current_mib
              local cgroup_events
              local process_snapshot

              now_epoch="$(date -u +%s)"
              sample_count=$((sample_count + 1))
              memory_available_mib="$(awk '/MemAvailable:/ { printf "%d", $2 / 1024 }' /proc/meminfo 2>/dev/null || true)"
              swap_free_mib="$(awk '/SwapFree:/ { printf "%d", $2 / 1024 }' /proc/meminfo 2>/dev/null || true)"
              runner_temp_available_mib="$(df -Pm "$RUNNER_TEMP" 2>/dev/null | awk 'NR == 2 { print $4 }' || true)"
              cgroup_current_mib="$(read_bytes_as_mib "${cgroup_dir:-/unavailable}/memory.current")"
              cgroup_peak_mib="$(read_bytes_as_mib "${cgroup_dir:-/unavailable}/memory.peak")"
              cgroup_swap_current_mib="$(read_bytes_as_mib "${cgroup_dir:-/unavailable}/memory.swap.current")"
              cgroup_events="$(read_memory_events "${cgroup_dir:-/unavailable}/memory.events")"

              echo "$android_perf_prefix sample=$sample_count utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) elapsed_s=$((now_epoch - build_started_epoch)) memory_available_mib=${memory_available_mib:-unavailable} swap_free_mib=${swap_free_mib:-unavailable} cgroup_memory_current_mib=$cgroup_current_mib cgroup_memory_peak_mib=$cgroup_peak_mib cgroup_swap_current_mib=$cgroup_swap_current_mib cgroup_memory_events=$cgroup_events runner_temp_available_mib=${runner_temp_available_mib:-unavailable}"

              process_snapshot="$(
                ps -eo pid=,ppid=,rss=,etimes=,comm= --sort=-rss 2>/dev/null |
                  awk '$5 ~ /^(java|node|hermesc?|cmake|ninja|gradle|gradlew|kotlin|kotlinc)$/ && count++ < 10 { print }'
              )" || process_snapshot=""

              if [[ -z "$process_snapshot" ]]; then
                echo "$android_perf_prefix process sample=$sample_count state=none"
              else
                while read -r pid ppid rss_kib process_elapsed_s comm; do
                  echo "$android_perf_prefix process sample=$sample_count pid=$pid ppid=$ppid rss_kib=$rss_kib elapsed_s=$process_elapsed_s comm=$comm"
                  if ((rss_kib > observed_peak_rss_kib)); then
                    observed_peak_rss_kib="$rss_kib"
                    observed_peak_pid="$pid"
                    observed_peak_comm="$comm"
                  fi
                done <<< "$process_snapshot"
              fi

              sleep "$monitor_interval_seconds" &
              monitor_sleep_pid=$!
              wait "$monitor_sleep_pid" 2>/dev/null || true
              monitor_sleep_pid=""
            done
          }

          build_monitor_pid=""
          stop_build_monitor() {
            if [[ -n "$build_monitor_pid" ]]; then
              kill "$build_monitor_pid" 2>/dev/null || true
              wait "$build_monitor_pid" 2>/dev/null || true
              build_monitor_pid=""
            fi
          }

          build_started_epoch="$(date -u +%s)"
          echo "$android_perf_prefix phase=eas-local-build event=start utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          monitor_build_resources "$build_started_epoch" &
          build_monitor_pid=$!
          trap stop_build_monitor EXIT

          if npx --no-install eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output "$asset_path"; then
            build_exit_code=0
          else
            build_exit_code=$?
          fi

          build_finished_epoch="$(date -u +%s)"
          echo "$android_perf_prefix phase=eas-local-build event=finish utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) elapsed_s=$((build_finished_epoch - build_started_epoch)) exit_code=$build_exit_code"

          if ((build_exit_code != 0)); then
            exit "$build_exit_code"
          fi

          stop_build_monitor
          trap - EXIT

          if [[ ! -s "$asset_path" ]]; then
            echo "::error::Local EAS build did not create $asset_path."
            exit 1
          fi

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      # A unique primary key lets a cancelled build publish a newer partial cache
      - name: Save Gradle cache
        if: ${{ always() && (steps.gradle-cache.outputs.cache-matched-key == '' || steps.build.outcome != 'success') }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Validate Android APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          asset_name="${{ steps.build.outputs.asset_name }}"
          asset_path="${{ steps.build.outputs.asset_path }}"
          if [[ ! -s "$asset_path" ]]; then
            echo "::error::APK is missing or empty: $asset_path"
            exit 1
          fi

          build_tools_dir="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools_dir/apksigner"
          aapt="$build_tools_dir/aapt"
          if [[ ! -x "$apksigner" || ! -x "$aapt" ]]; then
            echo "::error::Android build tools are missing apksigner or aapt in $build_tools_dir."
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$asset_path"

          badging="$("$aapt" dump badging "$asset_path")"
          package_line="$(sed -n '1p' <<< "$badging")"
          native_code_line="$(sed -n '/^native-code:/p' <<< "$badging")"
          echo "$package_line"
          echo "$native_code_line"
          if ! grep -Fq "name='sh.paseo.reforged'" <<< "$package_line"; then
            echo "::error::Expected package sh.paseo.reforged."
            exit 1
          fi
          if ! grep -Fq "versionName='$RELEASE_BASE_VERSION'" <<< "$package_line"; then
            echo "::error::Expected versionName $RELEASE_BASE_VERSION."
            exit 1
          fi
          if [[ "$native_code_line" != "native-code: 'arm64-v8a'" ]]; then
            echo "::error::Expected only arm64-v8a native code, got: ${native_code_line:-<missing>}."
            exit 1
          fi

          echo "Verified package=sh.paseo.reforged versionName=$RELEASE_BASE_VERSION nativeCode=arm64-v8a asset=$asset_name"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"

      - name: Remove Android build swap
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ "$ANDROID_BUILD_SWAP_FILE" != "$RUNNER_TEMP/"* ]]; then
            echo "::warning::Refusing to remove swap outside RUNNER_TEMP."
            exit 0
          fi

          if sudo swapon --show=NAME --noheadings | awk '{$1=$1; print}' | grep -Fxq "$ANDROID_BUILD_SWAP_FILE"; then
            if ! sudo swapoff "$ANDROID_BUILD_SWAP_FILE"; then
              echo "::warning::Failed to deactivate Android build swap; the hosted runner is ephemeral."
              exit 0
            fi
          fi
          if ! sudo rm -f -- "$ANDROID_BUILD_SWAP_FILE"; then
            echo "::warning::Failed to remove Android build swap; the hosted runner is ephemeral."
          fi
