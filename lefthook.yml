pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: sh ./scripts/run-npm-hook.sh run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: sh ./scripts/run-npm-hook.sh run lint -- {staged_files}
    - name: typecheck
      run: sh ./scripts/run-npm-hook.sh run typecheck
